version: '3.8'

services:
  # База данных
  db:
    image: postgres:16-alpine
    container_name: messenger_db
    restart: always
    environment:
      POSTGRES_USER: icq_admin
      POSTGRES_PASSWORD: super_secret_password_123
      POSTGRES_DB: messenger_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Порт наружу не выводим ради безопасности, БД доступна только внутри докера

  # Чат-брокер MQTT
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: messenger_broker
    restart: always
    volumes:
      - ./mosquitto/config:/mosquitto/config
    ports:
      - "1883:1883" # Оставляем для тестов

  # Веб-сервер и Фронтенд
  web:
    image: nginx:alpine
    container_name: messenger_web
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./public:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - mosquitto

volumes:
  pgdata: